<article id="contact" class="wrapper style4">
    <div class="container medium">
        <header class="reveal">
            <h2>{{ site.data[page.lang].ui.contact.title }}</h2>
            <p>{{ site.data[page.lang].ui.contact.subtitle }}</p>
        </header>
        <div class="contact-icons reveal reveal-delay-1">
            {% if site.email %}
            <a href="mailto:{{ site.email }}" class="contact-icon" aria-label="Email">
                <i class="fas fa-envelope"></i>
            </a>
            {% endif %}
            {% if site.linkedin_username %}
            <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener noreferrer"
                class="contact-icon" aria-label="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
            {% endif %}
            {% if site.github_username %}
            <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer"
                class="contact-icon" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
            {% endif %}
        </div>
    </div>
</article>
