<footer id="footer">
    <ul class="icons">
        {% if site.twitter_username %}
        <li><a href="https://twitter.com/{{ site.twitter_username }}" class="icon brands fa-twitter"><span
                    class="label">Twitter</span></a></li>
        {% endif %}
        {% if site.github_username %}
        <li><a href="https://github.com/{{ site.github_username }}" class="icon brands fa-github"><span
                    class="label">Github</span></a></li>
        {% endif %}
        {% if site.linkedin_username %}
        <li><a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" class="icon brands fa-linkedin-in"><span
                    class="label">LinkedIn</span></a></li>
        {% endif %}
        {% if site.email %}
        <li><a href="mailto:{{ site.email }}" class="icon solid fa-envelope"><span class="label">Email</span></a></li>
        {% endif %}
    </ul>
    <ul class="copyright">
        <li>&copy; {{ site.title }}. All rights reserved.</li>
    </ul>
</footer>
